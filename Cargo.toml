[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
memmap2 = "0.9"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hashbrown = "0.15"
memchr = "2"
mimalloc = { version = "0.1", default-features = false }
parquet = { version = "55", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
