[build]
# An explicit target keeps these flags off build scripts and proc-macros.
target = "x86_64-unknown-linux-gnu"

[target.x86_64-unknown-linux-gnu]
# AVX2 baseline (the scorers are Cascade Lake or newer) and a fully static binary,
# so the runtime image does not need a matching glibc.
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+crt-static"]
